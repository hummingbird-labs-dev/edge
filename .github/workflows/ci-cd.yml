name: Deploy Caddyfile

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-caddy-file:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Extract CADDY_SSH_HOST
        env:
          CADDY_ENV: ${{ secrets.CADDY_ENV }}
        run: |
          HOST=$(printf '%s\n' "$CADDY_ENV" | grep -E '^CADDY_SSH_HOST=' | cut -d= -f2-)
          if [ -z "$HOST" ]; then
            echo "CADDY_SSH_HOST not found in CADDY_ENV secret" >&2
            exit 1
          fi
          echo "CADDY_SSH_HOST=$HOST" >> "$GITHUB_ENV"

      - name: Deploy Caddy environment
        env:
          CADDY_ENV: ${{ secrets.CADDY_ENV }}
        run: |
          printf '%s\n' "$CADDY_ENV" |
            ssh -i ~/.ssh/id_ed25519 root@${CADDY_SSH_HOST} \
              'umask 077 && cat > /etc/caddy/caddy.env'

      - name: Load Caddyfile
        run: |
          scp -i ~/.ssh/id_ed25519 Caddyfile "root@${CADDY_SSH_HOST}:/etc/caddy/Caddyfile"

      - name: Validate Caddyfile
        run: |
          ssh -i ~/.ssh/id_ed25519 "root@${CADDY_SSH_HOST}" caddy validate --config /etc/caddy/Caddyfile --envfile /etc/caddy/caddy.env

      - name: Restart Caddy
        run: |
          ssh -i ~/.ssh/id_ed25519 "root@${CADDY_SSH_HOST}" systemctl restart caddy
